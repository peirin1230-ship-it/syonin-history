  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const yen = p => p == null ? "—" : "¥" + Number(p).toLocaleString("ja-JP", { maximumFractionDigits: 2 });
  const norm = s => String(s ?? "").normalize("NFKC").toUpperCase().replace(/\s+/g, "");

  let D, rows = [], shown = 200, current = null, kubunSel = new Set(), flagSel = new Set();

  async function load() {
    const b64 = $("#payload").textContent.trim();
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    let text;
    if (typeof DecompressionStream !== "undefined") {
      const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
      text = await new Response(stream).text();
    } else {
      throw new Error("このブラウザはデータ展開（DecompressionStream）に対応していません。最新のChrome / Edge / Safari / Firefoxで開いてください。");
    }
    return JSON.parse(text);
  }

  // cu（承認番号ごとのレセ電コード）: [code, setting, kubun, category, since, until, reason, next, nProducts, source, designated, sinceDoc, lastListed]
  // codes（マスター履歴）: code -> [[validFrom, price, unit, name, basicName, beppyo, kubunNo, abolish], ...]
  const byCode = new Map();
  const codeLast = c => { const h = D.codes[c]; return h ? h[h.length - 1] : null; };
  const mname = v => String(v[4] || v[3] || "").normalize("NFKC");
  const codeName = c => { const v = codeLast(c); return v ? mname(v) : ""; };
  const codeAbol = c => { const v = codeLast(c); return v ? v[7] : ""; };
  const codeFirst = c => { const h = D.codes[c]; return h ? h[0][0] : ""; };
  // 廃止後の版は価格が 0 になるので、最後に設定されていた価格を使う
  const lastPrice = c => { const h = D.codes[c] || []; for (let i = h.length - 1; i >= 0; i--) if (h[i][1]) return h[i][1]; return null; };
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const clink = c => `<button class="clink" type="button" data-code="${esc(c)}">${esc(c)}</button>`;

  function index() {
    // approvals: [no, sales, applicant, first, last, kubuns, nProducts, current[], flags]
    byCode.clear();
    for (const [no, list] of Object.entries(D.cu || {})) for (const u of list) {
      if (!byCode.has(u[0])) byCode.set(u[0], []);
      byCode.get(u[0]).push([no, u]);
    }
    rows = D.approvals.map(a => {
      const prods = D.products[a[0]] || [];
      const evs = D.events[a[0]] || [];
      const cats = a[7].map(c => (c.category || "") + " " + (c.master_name || "") + " " + (c.code || "")).join(" ")
        + " " + ((D.cu || {})[a[0]] || []).map(u => u[0]).join(" ");
      const hay = norm([a[0], a[1], a[2], cats].join(" "));
      const jans = prods.map(p => p[0]).join(" ");
      const hasRev = evs.some(e => e[1] === "price_revision");
      const hasAdd = evs.some(e => e[1] === "category_added" || e[1] === "category_changed");
      const hasCorr = evs.some(e => e[1] === "correction");
      const md = D.medis && D.medis.by_approval ? D.medis.by_approval[a[0]] : null;
      const medisDiff = !!(md && (md.not_in_notice.length || md.added.length || md.removed.length || md.price_changed.length));
      return { a, hay, jans, hasRev, hasAdd, hasCorr, abol: a[8].includes("廃止"), unk: a[8].includes("未対応"),
               medisDiff, medisOnly: a[8].includes("MEDISのみ") };
    });
    rows.sort((x, y) => (y.a[3] || "").localeCompare(x.a[3] || "") || x.a[0].localeCompare(y.a[0]));
  }

  const FLAGS = [
    ["add", "機能区分の変更・追加あり", r => r.hasAdd],
    ["abol", "廃止済の機能区分あり", r => r.abol],
    ["corr", "訂正あり", r => r.hasCorr],
    ["ocr", "OCR由来を含む", r => r.a[8].includes("OCR")],
    ["unk", "マスター未対応", r => r.unk],
    ["medis", "MEDISと差異あり", r => r.medisDiff],
    ["medisOnly", "MEDISのみ", r => r.medisOnly],
  ];

  function buildChips() {
    const flags = FLAGS.filter(([id]) => (id !== "medis" && id !== "medisOnly") || (D.medis && D.medis.snapshot));
    const ks = new Map();
    rows.forEach(r => r.a[5].split("/").filter(k => k && k !== "MEDIS").forEach(k => ks.set(k, (ks.get(k) || 0) + 1)));
    const order = [...ks.keys()].sort();
    $("#kubunChips").innerHTML = order.map(k => `<button class="chip" type="button" data-k="${esc(k)}" aria-pressed="false">区分${esc(k)} <span class="num">${ks.get(k).toLocaleString()}</span></button>`).join("");
    $("#flagChips").innerHTML = flags.map(([id, label]) => `<button class="chip" type="button" data-f="${id}" aria-pressed="false">${label}</button>`).join("");
    $("#kubunChips").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const k = b.dataset.k; kubunSel.has(k) ? kubunSel.delete(k) : kubunSel.add(k);
      b.setAttribute("aria-pressed", kubunSel.has(k)); shown = 200; renderList();
    });
    $("#flagChips").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const f = b.dataset.f; flagSel.has(f) ? flagSel.delete(f) : flagSel.add(f);
      b.setAttribute("aria-pressed", flagSel.has(f)); shown = 200; renderList();
    });
  }

  function filtered() {
    const q = norm($("#q").value);
    const isCode = /^\d{3}$/.test(q);
    return rows.filter(r => {
      if (kubunSel.size && !r.a[5].split("/").some(k => kubunSel.has(k))) return false;
      for (const [id, , fn] of FLAGS) if (flagSel.has(id) && !fn(r)) return false;
      if (!q) return true;
      if (isCode) return r.a[7].some(c => (c.category || "").normalize("NFKC").startsWith(q));
      return r.hay.includes(q) || (q.length >= 6 && /^\d+$/.test(q) && r.jans.includes(q));
    });
  }

  function renderList() {
    const f = filtered();
    $("#count").textContent = `${f.length.toLocaleString()} 件の承認番号`;
    const list = $("#list");
    if (!f.length) { list.innerHTML = `<div class="empty">該当する承認番号がありません。<br>B・C区分（特定保険医療材料）として通知に掲載されたものが対象です。</div>`; return; }
    list.innerHTML = f.slice(0, shown).map(r => {
      const a = r.a;
      return `<button class="item" type="button" role="listitem" data-no="${esc(a[0])}" aria-current="${current === a[0]}">
        <span class="no">${esc(a[0])}</span><span class="kb">${esc(a[3])}・区分${esc(a[5])}</span>
        <span class="nm">${esc(a[1]) || "（販売名なし）"}</span><span class="ap">${esc(a[2])}</span></button>`;
    }).join("") + (f.length > shown ? `<div class="more"><button type="button" id="moreBtn">さらに表示（残り ${(f.length - shown).toLocaleString()} 件）</button></div>` : "");
    const mb = $("#moreBtn"); if (mb) mb.onclick = () => { shown += 300; renderList(); };
  }

  function evRow(e, withNo) {
    // e: [date, type, title, detail, kubun, code, before, after, doc]
    const doc = e[8] && D.docs[e[8]];
    const price = (e[6] != null || e[7] != null) && (e[1] === "price_revision" || e[1] === "notice_price_diff")
      ? `<div class="price">${yen(e[6])} → <b>${yen(e[7])}</b>${e[6] ? ` <span class="sub2" style="display:inline">（${(e[7] - e[6] >= 0 ? "+" : "") + ((e[7] - e[6]) / e[6] * 100).toFixed(1)}%）</span>` : ""}</div>` : "";
    const inN = e[8] && D.nchanges && D.nchanges[e[8]] ? ` <button class="goto" type="button" data-doc="${esc(e[8])}">この通知の変更点一覧</button>` : "";
    const src = doc ? `<div class="src">出典: <a href="${esc(doc[1])}" target="_blank" rel="noopener">${esc(doc[0].replace(/［.*?］|（PDF：.*?）/g, ""))}</a>${inN}</div>`
      : e[1] === "price_revision" || e[1] === "category_abolished" || e[1] === "category_renamed" ? `<div class="src">出典: 特定器材マスター（レセ電コード ${clink(e[5])}）</div>` : "";
    const ctag = e[5] && (e[1] === "category_changed" || e[1] === "category_added") ? ` <span class="ctag">レセ電コード ${clink(e[5])}</span>` : "";
    const ocr = e[9] === "notice_ocr" ? ` <span class="pill warn" title="スキャン画像の通知をOCRで読み取った掲載です。出典PDFで確認してください">OCR</span>` : "";
    return `<li class="ev-${esc(e[1])}"><div class="d">${esc(e[0])}</div><div class="rail"><span class="dot"></span></div>
      <div class="body"><div class="t">${esc(e[2])}${ocr}</div>${e[3] ? `<div class="x">${esc(e[3])}${ctag}</div>` : ""}${price}${src}</div></li>`;
  }

  function renderApproval(no) {
    current = no;
    document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", b.dataset.no === no));
    const r = rows.find(x => x.a[0] === no); if (!r) return;
    const a = r.a, evs = D.events[no] || [], prods = D.products[no] || [];
    const curRows = a[7].map(c => {
      const cuRow = ((D.cu || {})[no] || []).find(u => u[0] === c.code);
      const succ = c.abolished && cuRow && cuRow[7] ? `<span class="sub2">後継: ${cuRow[7].split(",").map(clink).join("、")}</span>` : "";
      const st = c.abolished ? `<span class="pill bad">${esc(c.abolished)} 廃止</span>${succ}` : c.code ? "" : `<span class="pill warn">マスター未対応</span>`;
      const diff = c.price_now && c.price_listed != null && Math.abs(c.price_now - c.price_listed) >= 0.5
        ? `<span class="sub2">掲載時 ${yen(c.price_listed)}</span>` : "";
      return `<tr><td><span class="pill k">${esc(c.kubun || "")}</span></td>
        <td>${esc((c.master_name || c.category || "").normalize("NFKC"))}${c.master_name && c.master_name !== c.category ? `<span class="sub2">通知表記: ${esc(c.category)}</span>` : ""}</td>
        <td>${c.code ? clink(c.code) : "—"}</td><td class="r mono">${c.unit ? esc(c.unit) + " " : ""}${yen(c.price_now || (c.code && lastPrice(c.code)) || c.price_listed)}${diff}</td>
        <td class="mono">${esc(c.since || "")}</td><td class="r num">${c.n_products ? c.n_products.toLocaleString() : "—"}</td><td>${st}</td></tr>`;
    }).join("");
    const m = D.medis && D.medis.by_approval && D.medis.by_approval[no];
    const medisHtml = m ? renderMedis(m) : "";
    const PROD_LIMIT = 12;
    const prodRows = prods.map((p, i) => `<tr${i >= PROD_LIMIT ? ' class="more-prod" hidden' : ""}><td class="mono">${esc(p[0])}</td><td>${esc(p[1])}</td><td class="mono">${esc(p[2])}</td><td class="mono">${esc(p[3])}</td></tr>`).join("");
    $("#ledger").innerHTML = `
      <article class="sheet">
        <div class="eyebrow">承認番号・認証番号</div>
        <h2 class="appr">${esc(a[0])}</h2>
        <div class="sales">${esc(a[1])}</div>
        <div class="meta"><span>${r.medisOnly ? "製造販売業者" : "保険適用希望者"} <b>${esc(a[2])}</b></span>${a[3] ? `<span>初回適用 <b class="mono">${esc(a[3])}</b></span>` : ""}
          <span>区分 <b>${esc(a[5])}</b></span><span>製品 <b class="num">${a[6].toLocaleString()}</b> 件</span></div>
      </article>
      <article class="sheet">
        <h3>現在の機能区分 <small>${r.medisOnly ? "MEDIS登録内容" : "価格は特定器材マスターの現行値"}</small></h3>
        <div class="tbl-wrap"><table><thead><tr><th>区分</th><th>機能区分</th><th>レセ電コード</th><th class="r">償還価格</th><th>初掲載</th><th class="r">製品数</th><th>状態</th></tr></thead>
        <tbody>${curRows}</tbody></table></div>
      </article>
      ${renderCodeHistory(no)}
      ${medisHtml}
      <article class="sheet">
        <h3>変更の時系列 <small>${evs.length} 件</small></h3>
        ${r.medisOnly ? `<p class="note">この承認番号は解析範囲の通知（平成28年度後半以降）にB・C区分での掲載がありません。上の機能区分はMEDISの登録内容です。</p>` : ""}
        <div class="legend">${Object.entries({ listing_new: "保険適用", category_changed: "機能区分の変更・追加", products_added: "製品追加", price_revision: "価格改定", category_abolished: "廃止", correction: "訂正" }).map(([k, v]) => `<span class="ev-${k}"><i></i>${v}</span>`).join("")}</div>
        <ol class="timeline">${evs.map(e => evRow([e[0], e[1], e[2], e[3], e[4], e[5], e[6], e[7], e[8], e[9]])).join("")}</ol>
      </article>
      <article class="sheet">
        <h3>製品（製品コード） <small>${prods.length.toLocaleString()} 件・初掲載順</small></h3>
        <div class="tbl-wrap"><table><thead><tr><th>製品コード</th><th>製品名</th><th>初掲載</th><th>区分番号</th></tr></thead><tbody>${prodRows}</tbody></table></div>
        ${prods.length > PROD_LIMIT ? `<p><button class="toggle" type="button" id="prodToggle">すべて表示（${prods.length.toLocaleString()} 件）</button></p>` : ""}
      </article>`;
    $("#ledger").querySelectorAll(".goto").forEach(b => b.onclick = () => { showView("N"); renderNotice(b.dataset.doc); });
    const pt = $("#prodToggle");
    if (pt) pt.onclick = () => { document.querySelectorAll(".more-prod").forEach(tr => tr.hidden = false); pt.remove(); };
    try { history.replaceState(null, "", "#" + no); } catch (e) {}
    if (window.matchMedia("(max-width: 860px)").matches) $("#ledger").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  const REASON = { "使用中": "", "廃止": "bad", "廃止予定": "warn", "機能区分の変更": "k", "以後の掲載なし": "" };

  function priceSteps(code, from, to) {
    // コードのマスター履歴（価格・名称の変化だけ）。使用期間外は薄く表示
    const h = D.codes[code] || [];
    const out = [];
    let prev = null;
    for (const v of h) {
      const parts = [];
      if (!prev) parts.push(`${yen(v[1])}${v[2] ? "／" + esc(v[2]) : ""}`);
      else {
        if (prev[1] !== v[1] && v[1]) parts.push(`${yen(prev[1])} → <b>${yen(v[1])}</b>`);
        if (mname(prev) !== mname(v)) parts.push(`名称変更: ${esc(mname(v))}`);
        if (prev[7] !== v[7] && v[7]) parts.push(`廃止日 ${esc(v[7])} を設定`);
      }
      if (parts.length) {
        const inside = (!from || v[0] >= from || !prev) && (!to || v[0] <= to);
        out.push(`<li class="${inside ? "" : "out"}"><span class="mono">${esc(v[0] === D.ssk_first ? v[0] + "時点" : v[0])}</span> ${parts.join("・")}</li>`);
      }
      prev = v;
    }
    return out;
  }

  function gantt(items, labW = 84) {
    // items: [{label, from, to, cls}]
    const ds = items.flatMap(x => [x.from, x.to || today]).filter(Boolean).sort();
    if (!ds.length) return "";
    const y0 = +ds[0].slice(0, 4), y1 = Math.max(+ds[ds.length - 1].slice(0, 4), +today.slice(0, 4)) + 1;
    const t = d => (Date.parse(d) - Date.parse(`${y0}-01-01`)) / (Date.parse(`${y1}-01-01`) - Date.parse(`${y0}-01-01`)) * 100;
    const step = y1 - y0 > 12 ? 3 : y1 - y0 > 6 ? 2 : 1;
    let ticks = "";
    for (let y = y0; y <= y1; y += step) ticks += `<span style="left:${t(`${y}-01-01`).toFixed(2)}%">${y}</span>`;
    const rowsH = items.map(x => {
      const l = Math.max(0, t(x.from)), r = Math.min(100, t(x.to || today));
      return `<div class="g-row" style="grid-template-columns:${labW}px minmax(0,1fr)"><span class="g-lab">${esc(x.label)}</span><div class="g-track" title="${esc(x.title || "")}"><span class="g-bar ${x.cls}" style="left:${l.toFixed(2)}%;width:${Math.max(0.6, r - l).toFixed(2)}%"></span></div></div>`;
    }).join("");
    return `<div class="gantt">${rowsH}<div class="g-row" style="grid-template-columns:${labW}px minmax(0,1fr)"><span></span><div class="g-axis">${ticks}</div></div></div>`;
  }

  function renderCodeHistory(no) {
    const cu = (D.cu || {})[no] || [];
    if (!cu.length) return "";
    const items = cu.map(u => ({
      label: u[0], from: u[4], to: u[5] || null, title: `${u[4]} 〜 ${u[5] || "現在"}（${u[6]}）`,
      cls: (u[6] === "使用中" || u[6] === "廃止予定" ? "" : u[6] === "廃止" ? "abol" : "ended") + (u[9] === "notice_ocr" ? " ocr" : "") + (u[9] === "inferred" ? " inf" : "")
    }));
    const rowsH = cu.map(u => {
      const name = codeName(u[0]) || u[3];
      const nexts = u[7] ? u[7].split(",").filter(Boolean) : [];
      const nextLabel = u[6] === "機能区分の変更" ? "移行先" : u[6] === "以後の掲載なし" ? "後に掲載" : "後継候補";
      const steps = priceSteps(u[0], u[4], u[5]);
      const pills = (u[10] ? ` <span class="pill k" title="名称に指定承認番号を含む、この承認番号専用のコード（C1・C2の新機能区分で、次の改定まで使われる）">承認番号指定</span>` : "")
        + (u[9] === "notice_ocr" ? ` <span class="pill warn" title="スキャン画像の通知をOCRで読み取った掲載から判定">OCR</span>` : "")
        + (u[9] === "master" ? ` <span class="pill" title="通知の掲載とは対応付かず、特定器材マスターの名称の指定承認番号から判定">マスターのみ</span>` : "")
        + (u[9] === "inferred" ? ` <span class="pill" title="前のコードの廃止の翌日から有効な、同じ名称のコード（1つだけ）。通知への掲載はないため推定です">推定・後継</span>` : "");
      return `<tr><td>${clink(u[0])}${pills}</td>
        <td>${esc(name)}${u[3] && u[3] !== name ? `<span class="sub2">通知表記: ${esc(u[3])}</span>` : ""}
          ${steps.length ? `<details class="ph"><summary>価格・名称の推移（${steps.length}）</summary><ol>${steps.join("")}</ol></details>` : ""}</td>
        <td><span class="pill k">${esc(u[2] || "—")}</span></td>
        <td class="mono" style="white-space:nowrap">${esc(u[4])} 〜<br>${u[5] ? esc(u[5]) : "現在"}</td>
        <td>${u[6] ? `<span class="pill ${REASON[u[6]] || ""}">${esc(u[6])}</span>` : ""}${nexts.length ? `<span class="sub2">${nextLabel}: ${nexts.map(clink).join("、")}</span>` : ""}</td>
        <td class="r num">${u[8] ? u[8].toLocaleString() : "—"}</td></tr>`;
    }).join("");
    return `<article class="sheet">
      <h3>レセ電コード（特定器材コード）の履歴 <small>${cu.length} コード・この承認番号で使われた期間</small></h3>
      <div class="g-key"><span><i style="background:var(--ai)"></i>使用中</span><span><i style="background:var(--ink-3)"></i>別の機能区分へ移行・掲載終了</span><span><i style="background:var(--ev-abol)"></i>コード廃止</span>${cu.some(u => u[9] === "inferred") ? `<span><i style="box-shadow:inset 0 0 0 1.5px var(--ai)"></i>推定（同名の後継コード）</span>` : ""}</div>
      ${gantt(items)}
      <div class="tbl-wrap"><table><thead><tr><th>レセ電コード</th><th>機能区分（特定器材マスターの名称）</th><th>区分</th><th>使用期間</th><th>終了・移行</th><th class="r">製品数</th></tr></thead>
      <tbody>${rowsH}</tbody></table></div>
      <p class="note" style="margin-top:8px">開始日はこの承認番号がそのコードの機能区分で初めて掲載された適用日、終了日は製品が別の機能区分に移った適用日、またはコードの廃止日（経過措置の終わり）です。廃止の翌日に有効な同じ名称のコードが1つだけあるときは、それを後継とみなして「推定・後継」の行を足しています。各コードの「価格・名称の推移」では、この承認番号の使用期間外の改定を薄く表示しています。</p>
    </article>`;
  }

  // ---------------- レセ電コードで探す ----------------
  let codeRows = [], cshown = 200, curCode = null, codeSel = new Set();
  const CFLAGS = [
    ["used", "通知の承認番号で使用", r => r.n > 0],
    ["cur", "現行のコード", r => !r.abol || r.abol > today],
    ["abol", "廃止済", r => r.abol && r.abol <= today],
    ["desig", "承認番号指定", r => r.desig],
  ];

  function indexCodes() {
    codeRows = Object.keys(D.codes || {}).sort().map(c => {
      const v = codeLast(c), users = byCode.get(c) || [];
      const names = [...new Set((D.codes[c] || []).map(mname))].join(" ");
      return { c, v, n: users.length, abol: v[7], desig: users.some(x => x[1][10]) || /指定承認番号/.test(names),
               hay: norm(c + " " + names + " " + users.map(x => x[0]).join(" ")) };
    });
    $("#codeChips").innerHTML = CFLAGS.map(([id, label]) => `<button class="chip" type="button" data-f="${id}" aria-pressed="false">${label}</button>`).join("");
    $("#codeChips").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const f = b.dataset.f; codeSel.has(f) ? codeSel.delete(f) : codeSel.add(f);
      b.setAttribute("aria-pressed", codeSel.has(f)); cshown = 200; renderCodeList();
    });
  }

  function renderCodeList() {
    const q = norm($("#cq").value);
    const f = codeRows.filter(r => {
      for (const [id, , fn] of CFLAGS) if (codeSel.has(id) && !fn(r)) return false;
      return !q || r.hay.includes(q);
    });
    $("#ccount").textContent = `${f.length.toLocaleString()} 件のコード`;
    const list = $("#clist");
    if (!f.length) { list.innerHTML = `<div class="empty">該当するレセ電コードがありません。<br>特定器材マスター（平成24年4月以降の全版）に載ったコードが対象です。</div>`; return; }
    list.innerHTML = f.slice(0, cshown).map(r => {

  }

  function renderCode(code) {
    curCode = code;
    document.querySelectorAll("#clist .item").forEach(b => b.setAttribute("aria-current", b.dataset.code === code));
    const h = D.codes[code];
    const users = (byCode.get(code) || []).slice().sort((x, y) => x[1][4].localeCompare(y[1][4]) || x[0].localeCompare(y[0]));

    const first = h ? h[0][0] : "";
    const ab = v ? v[7] : "";
    const name = v ? mname(v) : users[0][1][3];
    const desigNo = (name.normalize("NFKC").match(/指定承認番号[・\s]*([0-9A-Z]{14,17})/) || [])[1];
    // マスター履歴（価格・名称・廃止日の変化）
    let prev = null;
    const hist = (h || []).map(x => {
      const chg = [];
      if (!prev) chg.push(x[0] === D.ssk_first ? "（マスターの収録開始時点）" : "新設");
      else {
        if (prev[1] !== x[1] && x[1]) {
          const pct = prev[1] ? ((x[1] - prev[1]) / prev[1] * 100) : null;
          chg.push(`価格 ${yen(prev[1])} → ${yen(x[1])}${pct != null ? ` <span class="${pct > 0 ? "up" : "down"}">（${pct > 0 ? "+" : ""}${pct.toFixed(1)}%）</span>` : ""}`);
        }
        if (mname(prev) !== mname(x)) chg.push(`名称変更（旧: ${esc(mname(prev))}）`);
        if (prev[6] !== x[6]) chg.push(`区分番号 ${esc(prev[6])} → ${esc(x[6])}`);
        if (prev[7] !== x[7]) chg.push(x[7] ? `廃止日 ${esc(x[7])} を設定${!x[1] ? "（価格の設定終了）" : ""}` : "廃止日の取消");
        if (!chg.length) chg.push("その他の項目の変更");
      }
      prev = x;

    }).reverse().join("");
    const nameOf = Object.fromEntries(D.approvals.map(a => [a[0], a[1]]));
    const userRows = users.map(([no, u]) => `<tr><td><button class="clink" type="button" data-no="${esc(no)}">${esc(no)}</button>${u[10] ? ` <span class="pill k">指定</span>` : ""}${u[9] === "notice_ocr" ? ` <span class="pill warn">OCR</span>` : ""}${u[9] === "inferred" ? ` <span class="pill" title="前のコードの廃止の翌日から有効な同じ名称のコード。通知への掲載はないため推定">推定</span>` : ""}${u[9] === "master" ? ` <span class="pill">マスターのみ</span>` : ""}</td>
        <td>${esc(nameOf[no] || "")}</td><td><span class="pill k">${esc(u[2] || "—")}</span></td>
        <td class="mono" style="white-space:nowrap">${esc(u[4])} 〜 ${u[5] ? esc(u[5]) : "現在"}</td>
        <td>${u[6] ? `<span class="pill ${REASON[u[6]] || ""}">${esc(u[6])}</span>` : ""}${u[7] ? `<span class="sub2">→ ${u[7].split(",").map(clink).join("、")}</span>` : ""}</td>
        <td class="r num">${u[8] || "—"}</td></tr>`).join("");
    // このコードへ移ってきた元のコード
    const from = new Map();
    for (const [no, list] of Object.entries(D.cu || {})) for (const u of list) if (u[7] && u[7].split(",").includes(code)) from.set(u[0], (from.get(u[0]) || 0) + 1);
    const succ = new Set(users.flatMap(([, u]) => u[7] ? u[7].split(",") : []));
    const rel = (from.size ? `<p>移行元・前身のコード: ${[...from.keys()].sort().map(c => `${clink(c)} <span class="cname">${esc(codeName(c))}</span>`).join("、")}</p>` : "")
      + (succ.size ? `<p>移行先・後継候補のコード: ${[...succ].sort().map(c => `${clink(c)} <span class="cname">${esc(codeName(c))}</span>`).join("、")}</p>` : "");
    $("#cdetail").innerHTML = `
      <article class="sheet">
        <div class="eyebrow">レセ電コード（特定器材コード）</div>
        <h2 class="appr">${esc(code)}</h2>
        <div class="sales">${esc(name)}</div>
        <div class="meta">${v ? `<span>別表 <b>${esc(v[5])}</b>・区分番号 <b class="mono">${esc(v[6])}</b></span>
          <span>${first === D.ssk_first ? `収録開始 <b class="mono">${esc(first)}</b> 以前から` : `新設 <b class="mono">${esc(first)}</b>`}</span>
          <span>${ab ? `${ab <= today ? "廃止" : "廃止予定"} <b class="mono">${esc(ab)}</b>` : "<b>現行</b>"}</span>
          <span>${ab && ab <= today ? "最終" : "現在"}の償還価格 <b class="mono">${v[2] ? esc(v[2]) + " " : ""}${yen(v[1] || lastPrice(code))}</b></span>` : ""}</div>
        ${desigNo ? `<p class="note" style="margin-top:8px"><span class="pill k">承認番号指定</span> 承認番号 <button class="clink" type="button" data-no="${esc(desigNo)}">${esc(desigNo)}</button> の製品専用のコードです（C1・C2の新機能区分。次の改定で告示の機能区分に入るまで使われます）。</p>` : ""}
        ${rel ? `<div class="note" style="margin-top:8px">${rel}</div>` : ""}
      </article>
      <article class="sheet">
        <h3>このコードを使った承認番号 <small>${users.length} 件・通知の掲載から判定${users.length > 40 ? "（図は使用開始の早い 40 件）" : ""}</small></h3>
        ${users.length ? `${gantt(users.slice(0, 40).map(([no, u]) => ({ label: no, from: u[4], to: u[5] || null, title: `${no} ${u[4]} 〜 ${u[5] || "現在"}`, cls: (u[6] === "使用中" || u[6] === "廃止予定" ? "" : u[6] === "廃止" ? "abol" : "ended") + (u[9] === "inferred" ? " inf" : "") })), 124)}
        <div class="tbl-wrap"><table><thead><tr><th>承認番号</th><th>販売名</th><th>区分</th><th>使用期間</th><th>終了・移行</th><th class="r">製品数</th></tr></thead><tbody>${userRows}</tbody></table></div>`
        : `<p class="note">B・C区分の通知の掲載で、このコードに対応付いた承認番号はありません。</p>`}
      </article>
      <article class="sheet">
        <h3>特定器材マスターでの履歴 <small>新しい順・${(h || []).length} 版</small></h3>
        <div class="tbl-wrap"><table class="mh"><thead><tr><th>変更年月日</th><th class="r">償還価格</th><th>変更内容</th><th>名称（基本漢字名称）</th></tr></thead><tbody>${hist}</tbody></table></div>
        <p class="note" style="margin-top:8px">支払基金（現・医療情報基盤・診療報酬審査支払機構）の特定器材マスター（平成24年4月以降の全版）から、価格・名称・区分番号・廃止日の変化を抜き出しています。</p>
      </article>`;
    try { history.replaceState(null, "", "#c-" + code); } catch (e) {}
    if (window.matchMedia("(max-width: 860px)").matches) $("#cdetail").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderMedis(m) {
    const rows = m.codes.map(c => `<tr><td class="mono">${esc(c.code || "—")}</td><td>${esc(c.name)}</td><td class="r mono">${yen(c.price)}</td><td class="mono">${esc(c.notice_date || "")}</td><td class="r num">${c.n_jan}</td></tr>`).join("");
    const notes = [];
    if (m.not_in_notice.length) notes.push(`<p><span class="pill warn">要確認</span> 解析範囲の通知（平成28年度後半以降）に掲載のない特定器材コードがMEDISにあります: ${m.not_in_notice.map(c => `<span class="mono">${esc(c.code)}</span> ${esc(c.name)}`).join("、")}。それ以前の掲載、改定時の区分移行、MEDIS側の登録内容のいずれかが考えられます。</p>`);
    if (m.added.length) notes.push(`<p>前回スナップショット（${esc(D.medis.prev_snapshot)}）から追加: ${m.added.map(c => esc(c.name)).join("、")}</p>`);
    if (m.removed.length) notes.push(`<p>前回から消えた区分: ${m.removed.map(c => esc(c.name)).join("、")}</p>`);
    if (m.price_changed.length) notes.push(`<p>前回から価格変更: ${m.price_changed.map(c => `${esc(c.name)} ${yen(c.before)} → ${yen(c.after)}`).join("、")}</p>`);
    return `<article class="sheet medis"><h3>MEDIS 医療機器データベース <small>${esc(D.medis.snapshot)} 時点・JAN ${m.n_jan.toLocaleString()} 件</small></h3>
      <div class="note">${notes.join("") || "<p>通知の掲載内容と矛盾はありません。</p>"}</div>
      <div class="tbl-wrap"><table><thead><tr><th>医事コード</th><th>特定保険医療材料名称</th><th class="r">償還価格</th><th>告示日</th><th class="r">JAN数</th></tr></thead><tbody>${rows}</tbody></table></div></article>`;
  }

  function renderHome() {
    current = null;
    const all = [];
    for (const [no, evs] of Object.entries(D.events)) for (const e of evs) all.push([no, e]);
    const types = new Set(["listing_new", "category_changed", "category_added", "category_abolished", "correction"]);
    const recent = all.filter(x => types.has(x[1][1])).sort((x, y) => y[1][0].localeCompare(x[1][0])).slice(0, 60);
    const name = Object.fromEntries(D.approvals.map(a => [a[0], a[1]]));
    $("#ledger").innerHTML = `
      <article class="sheet">
        <h3>直近の変更 <small>保険適用・機能区分の変更と追加・廃止・訂正（新しい順 60 件）</small></h3>
        <div class="feed">${recent.map(([no, e]) => `<div class="row ev-${esc(e[1])}"><span class="mono" style="color:var(--ink-2);font-size:12.5px">${esc(e[0])}</span>
          <div><button type="button" data-no="${esc(no)}">${esc(no)}</button> ${esc(name[no] || "")}<br><b style="color:var(--c)">${esc(e[2])}</b> <span class="x" style="color:var(--ink-2);font-size:13px">${esc((e[3] || "").slice(0, 120))}</span></div></div>`).join("")}</div>
      </article>
      <article class="sheet note">
        <h3>このデータについて</h3>
        <p>厚生労働省「医療機器の保険適用について」（毎月の保医発通知、一部訂正・差替を含む）のうち、B・C区分（特定保険医療材料）として掲載された行を承認番号ごとにまとめています。償還価格の改定・機能区分の廃止は、支払基金（現・医療情報基盤・診療報酬審査支払機構）の特定器材マスター全版と照合して表示しています。</p>
        <p>平成20〜28年度前半の通知はスキャン画像のため、OCR（文字認識）で読み取っています。承認番号と製品コードは既知の番号と照合して補正し、機能区分は区分番号と価格から当時の特定器材マスターの区分に当てています。これらの掲載には <span class="pill warn">OCR</span> の印を付けています。誤読が残っている可能性があるので、出典PDFで確認してください。この時期の古い様式の訂正通知（「項目／誤／正」を文章で書く形式）は反映していません。</p>

        <p>A1（包括）・A2（特定包括）は含みません。機能区分とマスターの対応は名称の類似度と価格で自動判定しているため、「マスター未対応」の行は通知の表記をそのまま表示しています。</p>

  function renderNoticeList() {

        <span class="nd">${esc(n[2])} 適用</span><span class="nk">${esc(kind)}・${n[8]}件</span>
        <span class="nc">${keys.map(k => `<span class="tb t-${esc(k)}">${esc(k)} ${c[k]}</span>`).join("") || `<span class="tb t-変更なし">大きな変更なし</span>`}</span></button>`;

  }

  function renderNotice(doc) {
    curDoc = doc;
    document.querySelectorAll(".nitem").forEach(b => b.setAttribute("aria-current", b.dataset.doc === doc));
    const n = D.notices.find(x => x[0] === doc);
    if (!n) return;
    const rowsAll = (D.nchanges[doc] || []).slice();
    const corr = D.corr_by_target[doc] || [];
    const corrAppr = new Set(corr.map(x => x[1]));
    const c = n[7] || {};
    const isOcr = n[6].startsWith("OCR");
    const q = norm(($("#nq") || {}).value || "");
    const rowsF = rowsAll.filter(r => {
      const types = r[5].split(",");
      if (typeSel.size && !types.some(t => typeSel.has(t)) && !(typeSel.has("訂正") && corrAppr.has(r[0]))) return false;
      if (q && !norm(r[0] + r[1] + r[2]).includes(q)) return false;
      return true;
    }).sort((a, b) => Math.min(...a[5].split(",").map(PRIO)) - Math.min(...b[5].split(",").map(PRIO)) || a[0].localeCompare(b[0]));
    const tiles = TYPES.filter(t => c[t]).map(t => `<button class="tile" type="button" data-t="${esc(t)}" aria-pressed="${typeSel.has(t)}" title="${esc(TYPE_NOTE[t])}"><b>${c[t]}</b><span>${esc(t)}</span></button>`).join("")
      + (corr.length ? `<button class="tile" type="button" data-t="訂正" aria-pressed="${typeSel.has("訂正")}" title="この通知に対する一部訂正で直された承認番号"><b>${corrAppr.size}</b><span>あとで訂正</span></button>` : "");
    const rowsHtml = rowsF.map(r => {
      const types = r[5].split(",");
      const K = x => Array.isArray(x) ? (x[1] || x[0]) : x;
      const L = x => Array.isArray(x) ? `${esc(x[0])}${x[1] ? ` <span class="ctag">${clink(x[1])}</span>` : ""}` : esc(x);

      const detail = (types.includes("新規") ? (r[8].some(x => Array.isArray(x) && x[1]) ? `<div class="sub2" style="margin-top:3px">レセ電コード: ${[...new Set(r[8].map(x => x[1]).filter(Boolean))].map(clink).join("、")}</div>` : "")
        : `<details><summary>変更前と変更後の機能区分・レセ電コード</summary><div class="ba">
          <div><h4>この通知の前</h4><ul>${r[7].map(x => `<li class="${after.has(K(x)) ? "" : (gone(x) ? "gone" : "")}">${L(x)}</li>`).join("") || "<li>—</li>"}</ul></div>
          <div><h4>この通知での掲載</h4><ul>${r[8].map(x => `<li class="${before.has(K(x)) ? "" : "new"}">${L(x)}</li>`).join("") || "<li>—</li>"}</ul></div></div></details>`);
      return `<div class="ncrow"><div class="who"><button type="button" data-no="${esc(r[0])}">${esc(r[0])}</button>
          <div class="sn">${esc(r[1])}</div><div class="ap">${esc(r[2])}・区分${esc(r[3])}・製品${r[10]}件</div></div>
        <div class="what"><div class="bs">${typeBadges(types)}${corrAppr.has(r[0]) ? `<span class="tb t-訂正">あとで訂正</span>` : ""}</div>
          <div class="sm">${esc(r[6])}</div>${detail}</div></div>`;
    }).join("");

    $("#ndetail").innerHTML = `
      <article class="sheet">
        <div class="eyebrow">医療機器の保険適用について${n[3] === "replacement" ? "（別紙の差し替え後の内容）" : ""}${isOcr ? ` <span class="pill warn">OCR</span>` : ""}</div>
        <h2 class="sales" style="margin-top:6px">${esc(n[2])} 適用分</h2>
        <div class="meta"><span>通知日 <b class="mono">${esc(n[1])}</b></span><span>掲載 <b class="num">${n[8]}</b> 承認番号</span>
          <span><a href="${esc(n[5])}" target="_blank" rel="noopener">${esc(title)}（PDF）</a></span></div>
        <div class="tiles" id="tiles">${tiles}</div>
        <p class="note" style="margin:6px 0 0">枠を押すとその種類だけに絞り込みます。比較の基準は、その承認番号のこの通知より前の掲載（平成20年10月以降）です。${isOcr ? "この通知はスキャン画像のため OCR で読み取っています。" : ""}</p>
      </article>
      <article class="sheet">
        <h3>掲載された承認番号 <small>${rowsF.length} / ${rowsAll.length} 件・変更の大きい順</small></h3>
        <input id="nq" class="nsearch" type="search" placeholder="この通知の中を承認番号・販売名・企業名で検索" value="${esc(($("#nq") || {}).value || "")}" autocomplete="off">
        <div>${rowsHtml || `<div class="empty">該当する承認番号がありません。</div>`}</div>
      </article>`;
    $("#tiles").onclick = e => {
      const b = e.target.closest(".tile"); if (!b) return;
      const t = b.dataset.t; typeSel.has(t) ? typeSel.delete(t) : typeSel.add(t);
      renderNotice(doc);
    };
    const nq = $("#nq");
    let tm; nq.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { const pos = nq.selectionStart; renderNotice(doc); const n2 = $("#nq"); n2.focus(); try { n2.setSelectionRange(pos, pos); } catch (e) {} }, 200); };
    $("#ndetail").querySelectorAll(".who button").forEach(b => b.onclick = () => { showView("A"); renderApproval(b.dataset.no); });
    try { history.replaceState(null, "", "#n-" + doc); } catch (e) {}
    if (window.matchMedia("(max-width: 860px)").matches) $("#ndetail").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function showView(v) {
    for (const k of ["N", "A", "C"]) {
      $("#view" + k).hidden = v !== k;
      $("#tab" + k).setAttribute("aria-selected", v === k);
    }
  }

  function coverage() {
    const s = D.notice_stats || {};
    const nM = D.approvals.filter(a => (a[8] || "").includes("MEDISのみ")).length;
    $("#coverage").innerHTML = `<span>承認番号 <b class="num">${(D.approvals.length - nM).toLocaleString()}</b>${nM ? `（MEDISのみ <b class="num">${nM.toLocaleString()}</b>）` : ""}</span>
      <span>掲載期間 <b class="mono">${esc(D.span[0] || "")}</b> 〜 <b class="mono">${esc(D.span[1] || "")}</b></span>
      <span>通知 解析済 <b class="num">${(s["解析済"] || 0)}</b>・OCR <b class="num">${(s["OCR（要確認）"] || 0)}</b>${s["スキャン画像（未対応）"] ? `・未対応 <b class="num">${s["スキャン画像（未対応）"]}</b>` : ""}</span>
      <span>更新 <b class="mono">${esc((D.built_at || "").slice(0, 10))}</b></span>`;
  }

  load().then(d => {
    D = d; D.codes = D.codes || {}; D.cu = D.cu || {};
    index(); indexCodes(); coverage(); buildChips(); renderList(); renderNoticeList(); renderCodeList();
    renderHome();
    const route = boot => {
      const h = decodeURIComponent(location.hash.slice(1));
      if (h && D.events[h]) { showView("A"); renderApproval(h); }
      else if (h.startsWith("n-") && D.nchanges[h.slice(2)]) { showView("N"); renderNotice(h.slice(2)); }
      else if (h.startsWith("c-") && (D.codes[h.slice(2)] || byCode.has(h.slice(2)))) { showView("C"); renderCode(h.slice(2)); }
      else if (boot) { showView("N"); if (D.notices.length) renderNotice(D.notices[0][0]); }
    };
    route(true);
    window.addEventListener("hashchange", () => route(false));
    $("#tabN").onclick = () => { showView("N"); if (!curDoc && D.notices.length) renderNotice(D.notices[0][0]); };
    $("#tabA").onclick = () => showView("A");
    $("#tabC").onclick = () => { showView("C"); if (!curCode) $("#cdetail").innerHTML = `<article class="sheet note"><h3>レセ電コード（特定器材コード）</h3><p>左の一覧からコードを選ぶと、特定器材マスターでの価格・名称・廃止の履歴と、そのコードを使った承認番号（使用期間）を表示します。</p><p>承認番号ごとのコードの移り変わりは「承認番号で探す」の各承認番号のページにも表示しています。</p></article>`; };
    let tc; $("#cq").addEventListener("input", () => { clearTimeout(tc); tc = setTimeout(() => { cshown = 200; renderCodeList(); }, 120); });
    $("#clist").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) renderCode(b.dataset.code); });
    document.addEventListener("click", e => {
      const b = e.target.closest(".clink"); if (!b) return;
      if (b.dataset.code) { showView("C"); renderCode(b.dataset.code); }
      else if (b.dataset.no) { if (D.events[b.dataset.no]) { showView("A"); renderApproval(b.dataset.no); } }
    });
    $("#nlist").addEventListener("click", e => { const b = e.target.closest(".nitem"); if (b) { typeSel.clear(); renderNotice(b.dataset.doc); } });
    let t; $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { shown = 200; renderList(); }, 120); });
    $("#list").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) renderApproval(b.dataset.no); });
  }).catch(err => { $("#ledger").innerHTML = `<div class="sheet">${esc(err.message)}</div>`; });
})();
</script>
